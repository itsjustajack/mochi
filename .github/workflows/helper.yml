name: Helper (tests, Windows app, phone app)

on:
  push:
    paths:
      - 'helper-bots/**'
      - '.github/workflows/helper.yml'
  pull_request:
    paths:
      - 'helper-bots/**'
      - '.github/workflows/helper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests
        working-directory: helper-bots
        run: python -m unittest discover -s tests -t . -v

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Signing key from repo secrets (Settings > Secrets and variables > Actions):
      #   HELPER_KEYSTORE_B64 = the keystore file, base64-encoded
      #   HELPER_KEYSTORE_PASSWORD = its password
      - name: Load the signing key
        env:
          KS_B64: ${{ secrets.HELPER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/helper.keystore"
            echo "HELPER_KEYSTORE_FILE=$RUNNER_TEMP/helper.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::HELPER_KEYSTORE_B64 is not set, so this APK uses a throwaway debug key and won't update an installed Helper."
          fi

      - name: Build Helper.apk
        working-directory: helper-bots/android
        env:
          HELPER_KEYSTORE_PASSWORD: ${{ secrets.HELPER_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package the APK
        run: |
          cp helper-bots/android/app/build/outputs/apk/release/app-release.apk Helper.apk
          keytool -printcert -jarfile Helper.apk | grep -i sha256 | head -1 > signing.txt || true
          cat signing.txt

      # The build is kept as a download on this run's page (Actions > this run > Artifacts) for a few
      # weeks. There is no GitHub release: Jack installs Helper.apk over the old one from the file.
      - uses: actions/upload-artifact@v4
        with:
          name: Helper-phone
          path: Helper.apk
          retention-days: 30

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the engine starts on Windows
        working-directory: helper-bots
        shell: pwsh
        run: |
          $env:HELPER_HOME = "$env:RUNNER_TEMP\helper-home"
          $env:HELPER_SECRETS_IN_FILES = "1"
          python -c "from helper.desktop.engine import Engine; e = Engine(start_servers=False); print(len(e.agents), 'agents', e.call('GET', '/v1/today')[0])"
          python -m unittest tests.test_desktop tests.test_checklist tests.test_calm -v
      - name: Build Helper.exe
        working-directory: helper-bots
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.*"
          python scripts/make_icon.py build
          pyinstaller --noconfirm --onefile --windowed --name Helper --icon build/helper.ico --add-data "build/helper.ico;." --add-data "helper/defaults;helper/defaults" --add-data "helper/skills/originals;helper/skills/originals" --collect-submodules helper helper/desktop/__main__.py
      # Kept as a download on this run's page (Actions > this run > Artifacts). No GitHub release.
      # To update: close Helper, replace Helper.exe with the new one. Your settings stay in C:\BotWork\.helper.
      - uses: actions/upload-artifact@v4
        with:
          name: Helper-windows
          path: helper-bots/dist/Helper.exe
          retention-days: 30
