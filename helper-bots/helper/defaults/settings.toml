# Global settings: defaults for every agent. Each value can only narrow the policy.
[general]
profile = "home"
default_agent = "organizer"

[model]
base_url = "http://127.0.0.1:11434"   # the one shared Ollama on the PC, never exposed on Wi-Fi
model = "qwen3:8b"                    # phone: qwen3:4b
temperature = 0.2
num_ctx = 16384
think = false
timeout_s = 180

[limits]
max_steps = 12
max_minutes = 10
max_tokens = 30000

[server]
host = "127.0.0.1"
port = 8765

# Encrypted brain dump notes the phone saved to Drive (".hln" files). The PC picks them up from here.
# For example: folder = "G:/My Drive/Helper/Capture"
[capture]
folder = ""

# Stub Link: lets your phone send jobs to this PC over home Wi-Fi. Off until you turn it on.
# host = this PC's Wi-Fi address (for example 192.168.1.20). Never 0.0.0.0.
# Turn it on in the app (Settings > Phone link); each paired phone gets its own key.
[link]
enabled = false
host = ""
port = 8766
