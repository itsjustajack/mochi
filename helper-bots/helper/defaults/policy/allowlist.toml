# HARD LIMITS. Folders and hosts the bots may ever touch.
# Relative paths are inside the Helper home folder (~/.helper, or C:\BotWork\.helper).
# The policy, settings, agents, logs and secret folders are always refused, even if listed.

roots = ["work"]

# Web hosts fetch tools may reach (no fetch tool in v0.1 yet).
hosts = []

# Tier 2 tools that may run without asking (never applies to tier 3,
# and never in a task that has read untrusted or suspicious content).
auto_allow = []

# Drive knowledge: folders agents may READ (never write). With Google Drive for desktop on Windows,
# Drive shows up as a drive letter, for example: knowledge = ["G:/My Drive/Helper"]
knowledge = []

# Jack's rule docs: files every agent gets as fixed rules, for example
# rule_docs = ["G:/My Drive/Helper/Guild_Prompt.txt", "G:/My Drive/Helper/Guild_Agent_Prompts.txt"]
# `helper policy approve` takes a snapshot; a changed doc is only used after you approve again.
rule_docs = []
