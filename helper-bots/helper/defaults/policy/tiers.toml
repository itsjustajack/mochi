# Limits and tool tiers. Only Jack edits this file, by hand.
# After any change run `helper policy approve`, or every tier 2 and 3 call is refused.
#
# Tiers say how big a job is. They only set the STARTING row on each agent's checklist:
#   0 = read / harmless (starts as Do), 1 = small and reversible (starts as Do),
#   2 = changes things (starts as Ask me, or Do if in auto_allow), 3 = destructive or outward (starts as Ask me).
# Jack can then set any job for any agent to Do, Ask me or Never in Settings. Nothing is locked.

[limits]
max_steps = 15            # per task
max_minutes = 10          # per task
max_tokens = 30000        # model tokens per task
max_tier2_calls = 10      # tier 2+ calls per task
approval_timeout_s = 600  # silence = deny
fatigue_max = 5           # approvals asked in the window before the task pauses
fatigue_window_s = 600
breaker_denials = 3       # gate denials in one task before it is stopped
max_result_chars = 16000  # tool output is cut to this before the model sees it

[tools]
list_folder = 0
read_file = 0
roll_dice = 0
check_code = 0        # reads a script and reports problems; never runs it
ledger_search = 0     # read the Guild Ledger
ledger_propose = 1    # add a draft entry; only Jack makes canon
knowledge_search = 0  # search linked Drive folders (read-only)
knowledge_read = 0    # read a file from linked Drive folders
private_search = 0    # Jack's private records (real life, kept apart from story lore)
private_propose = 1   # add a draft private record; never a password, only where it lives
write_file = 2
move_file = 2
delete_file = 3

# Tools that are off everywhere, whatever an agent asks for.
# There is deliberately no shell tool at all.
disabled = []
