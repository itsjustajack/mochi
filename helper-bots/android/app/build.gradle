plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.itsjustajack.helper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.itsjustajack.helper'
        minSdk 30          // Android 11+: biometric-or-PIN prompt for approvals
        targetSdk 34
        versionCode buildNumber
        versionName "0.4.${buildNumber}"
        // 64-bit phones only (Jack's S23 FE), so the download stays as small as it can.
        ndk { abiFilters 'arm64-v8a' }
    }

    // Signed with Jack's own key so every build installs over the last one (sideloaded, not on the
    // Play Store). The key never lives in the repo: CI writes it from the HELPER_KEYSTORE_B64 secret.
    def ksFile = System.getenv('HELPER_KEYSTORE_FILE')
    signingConfigs {
        shared {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('HELPER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HELPER_KEY_ALIAS') ?: 'helper'
                keyPassword System.getenv('HELPER_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without the secret the build falls back to the debug key (fine for testing, but each
            // such build has a different key, so it won't install over the previous one).
            signingConfig ksFile ? signingConfigs.shared : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Helper's engine: the same Python package as the PC (helper-bots/helper), copied into
// src/main/python by the copyEngine task below. Standard library only, no pip packages.
chaquopy {
    defaultConfig {
        version = "3.12"
        pyc {
            src = false
        }
    }
}

tasks.register('copyEngine', Copy) {
    from("${rootDir}/../helper") {
        exclude '**/__pycache__/**'
    }
    into "${projectDir}/src/main/python/helper"
}
preBuild.dependsOn 'copyEngine'
// Chaquopy's own tasks read src/main/python, so they must run after the copy.
tasks.matching { it.name.contains('Python') }.configureEach { dependsOn 'copyEngine' }

// No other libraries: only the Android framework and the Python runtime.
dependencies {
}
