<header class="top">
  <button id="navBtn" class="btn navbtn" type="button" aria-controls="side" aria-expanded="false" aria-label="Menu">&#9776;</button>
  <div class="brand"><b>Script Builder</b><span class="ver">for Janitor AI &middot; v2.0</span></div>
  <div class="proj"><input id="projTitle" type="text" aria-label="Project title" spellcheck="false"></div>

  <div class="actions">
    <button id="copyBtn" class="btn primary" type="button">Copy script</button>
    <div class="menu"><button id="menuBtn" class="btn" type="button" aria-haspopup="menu">Project &#9662;</button></div>
    <button id="modeBtn" class="btn ghost" type="button" aria-pressed="true">Simple</button>

  </div>
</header>
<div class="scrim" id="scrim" aria-hidden="true"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>

</div>
